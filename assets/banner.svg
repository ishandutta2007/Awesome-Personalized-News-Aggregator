<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(-15px); opacity: 0.8; }
        100% { transform: translateY(0px); opacity: 0.2; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .node-pulse { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
      .flow-line { stroke-dasharray: 8 6; animation: dashMove 3s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 30px; fill: url(#titleGrad); }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 15px; fill: #94a3b8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #e2e8f0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Animated Background Orbs / Dynamic Elements -->
  <circle cx="150" cy="60" r="100" fill="#3b82f6" class="node-pulse" filter="url(#glow)" />
  <circle cx="780" cy="180" r="120" fill="#8b5cf6" class="node-pulse" filter="url(#glow)" />

  <!-- Flow lines connecting nodes -->
  <path d="M 60 210 Q 250 240 450 210 T 840 210" fill="none" stroke="#6366f1" stroke-width="2" class="flow-line" opacity="0.4" />
  <path d="M 100 40 Q 350 10 600 40 T 850 40" fill="none" stroke="#06b6d4" stroke-width="1.5" class="flow-line" opacity="0.3" />

  <!-- Dynamic Pills / Badges in Background Layer -->
  <g class="particle-1">
    <rect x="680" y="35" width="150" height="28" rx="14" fill="url(#accentGrad)" stroke="rgba(168,85,247,0.3)" stroke-width="1" />
    <text x="755" y="53" text-anchor="middle" class="badge-text">⚡ Algorithmic RSS</text>
  </g>

  <g class="particle-2">
    <rect x="70" y="185" width="160" height="28" rx="14" fill="url(#accentGrad)" stroke="rgba(56,189,248,0.3)" stroke-width="1" />
    <text x="150" y="203" text-anchor="middle" class="badge-text">🔒 Self-Hosted Privacy</text>
  </g>

  <!-- Foreground Main Card -->
  <rect x="40" y="30" width="820" height="155" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- RSS Icon & Graphics in Main Card -->
  <g transform="translate(70, 60)">
    <rect x="0" y="0" width="54" height="54" rx="14" fill="#f97316" />
    <circle cx="16" cy="38" r="5" fill="#ffffff" />
    <path d="M 11 23 A 16 16 0 0 1 27 39" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 11 13 A 26 26 0 0 1 37 39" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Title and Subtitle -->
  <text x="142" y="82" class="title-text">Awesome Personalized News Aggregator 📰</text>
  <text x="142" y="112" class="subtitle-text">Curated Ecosystem of Commercial Portals, AI Feed Summarizers &amp; Open-Source Readers</text>

  <!-- Highlight Pills inside card -->
  <g transform="translate(142, 130)">
    <rect x="0" y="0" width="115" height="24" rx="12" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1" />
    <text x="57.5" y="16" text-anchor="middle" class="badge-text" fill="#93c5fd">🤖 AI Curation</text>

    <rect x="125" y="0" width="125" height="24" rx="12" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1" />
    <text x="187.5" y="16" text-anchor="middle" class="badge-text" fill="#c084fc">🏠 Self-Hosted</text>

    <rect x="260" y="0" width="115" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
    <text x="317.5" y="16" text-anchor="middle" class="badge-text" fill="#6ee7b7">📡 Feed Readers</text>
  </g>
</svg>
